name: Deploy to prod

# Manual-only деплой.
# Фикс от 2026-07-07: убрали автотриггер (workflow_run на успешный CI)
# после brute-force incident на соседнем VPS у провайдера — не хотим,
# чтобы merge в main сразу катил в prod. CI прогоняем, но выкатываем осознанно.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Введите "deploy" для подтверждения'
        required: true
        default: ''

# Не даём двум деплоям идти параллельно на один сервер.
# cancel-in-progress НЕ ставим — прерванный docker pull может оставить кривое состояние.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Guard against accidental trigger
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo "::error::Введите 'deploy' в поле подтверждения. Вы ввели: '${{ github.event.inputs.confirm }}'"
          exit 1

      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: meta
        run: echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push двух тегов: sha-<12hex> (immutable, для точного отката) + latest.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/kykp/smeteora-backend:sha-${{ steps.meta.outputs.short_sha }}
            ghcr.io/kykp/smeteora-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # SSH-ключ приходит в base64 (одной строкой). Кладём в файл, chmod 600.
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Известный host'а — чтобы избежать интерактивного prompt'а первого коннекта.
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # На сервере:
      #   1) pull свежего образа
      #   2) миграции: docker compose run --rm --profile migrate migrator
      #   3) up backend (перезапуск с новым образом)
      # docker compose pull не роняет запущенный контейнер — он только скачивает.
      # Даун-тайма практически нет: старый контейнер живёт до up -d --force-recreate.
      #
      # ВАЖНО: prune старых образов — раз в день. Здесь не делаем, чтобы не мешать
      # быстрому rollback'у. Отдельная джоба чистит по расписанию (в будущем).
      - name: Deploy over SSH
        run: |
          ssh -o StrictHostKeyChecking=yes \
              -i ~/.ssh/id_ed25519 \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              'set -euo pipefail
               cd /opt/smeteora-api
               docker compose -f docker-compose.prod.yml pull
               docker compose -f docker-compose.prod.yml --profile migrate run --rm migrator
               docker compose -f docker-compose.prod.yml up -d --force-recreate backend
               docker compose -f docker-compose.prod.yml ps'

      # Smoke test — /healthz должен ответить 200 после деплоя.
      # Если не отвечает — джоба падает, оповещение придёт на GH.
      - name: Smoke test /healthz
        run: |
          for i in {1..20}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://api.smeteora.ru/healthz || echo 000)
            if [ "$code" = "200" ]; then
              echo "healthz OK"
              exit 0
            fi
            echo "attempt $i: got $code, retry in 3s"
            sleep 3
          done
          echo "healthz не ответил 200 после 60 секунд"
          exit 1
